name: Spring Boot CI

on:
  push:
    branches:
      - [main, dev]
  pull_request:
    branches:
      - [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package
      - name: Run tests with Maven
        working-directory: ./backend
        run: mvn test
